name: Enable Automerge

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - main

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    name: Enable PR Automerge
    # Only enable automerge for dependabot PRs or PRs explicitly labelled automerge.
    # GitHub's built-in auto-merge still requires all required status checks to pass
    # and any required reviews to be approved before the merge is executed.
    if: >
      github.actor == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'automerge')
    steps:
      - name: Enable automerge
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
